<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Coordinadora — CTTG</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit',sans-serif;min-height:100vh;background:#f4f6fb;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#ffffff;border:1px solid #e4e8ef;border-radius:20px;padding:36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(15,23,42,.10)}
  .back{color:#334155;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:24px;transition:color .2s}
  .back:hover{color:#0f172a}
  .logo{width:56px;height:56px;background:linear-gradient(135deg,#059669,#10b981);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:16px}
  h2{font-family:'DM Serif Display',serif;font-size:22px;color:#0f172a;margin-bottom:4px}
  .desc{color:#334155;font-size:13px;margin-bottom:24px}
  .fg{margin-bottom:16px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#334155;margin-bottom:6px}
  input{width:100%;background:#ffffff;border:1px solid #d3d9e3;border-radius:10px;color:#0f172a;font-family:'Outfit',sans-serif;font-size:14px;padding:12px 14px;outline:none;transition:border-color .2s}
  input::placeholder{color:#64748b}
  input:focus{border-color:rgba(16,185,129,.7);background:#ffffff}
  .err{background:#fde3e3;border:1px solid #fac7c7;color:#b91c1c;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none}
  .btn{width:100%;background:linear-gradient(135deg,#059669,#10b981);color:#fff;border:none;padding:13px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;box-shadow:0 4px 15px rgba(16,185,129,.4);transition:all .2s}
  .btn:hover{transform:translateY(-1px)}
  .btn:disabled{opacity:.6;transform:none;cursor:not-allowed}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid #d3d9e3;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
</head>
<body class="pag-acceso">
<div class="card">
  <a href="index.html" class="back">← Volver</a>
  <div class="logo">👩‍💼</div>
  <h2>Acceso Coordinación</h2>
  <p class="desc">Coordinadora o Asistente — gestión de radicaciones</p>
  <div id="err" class="err"></div>
  <div class="fg"><label>Correo administrativo</label><input type="email" id="email" placeholder="coordinadora@usc.edu.co" autocomplete="email"></div>
  <div class="fg"><label>Contraseña</label><input type="password" id="pass" placeholder="••••••••" autocomplete="current-password"></div>
  <button class="btn" id="btn" onclick="login()">Ingresar al panel</button>
</div>

<script>
const URL_APP = "https://script.google.com/macros/s/AKfycbx8J-FjMJCgtQBHTqXmOpbxVZxrbR1_DT7w55ucesQYtTdZgnbxBprB7c4auHhi9PQk/exec";

const CTTG_FETCH_HEADERS_LOGIN = { 'Content-Type': 'text/plain;charset=utf-8', Accept: 'application/json' };

/** Petición lista usuarios; usa correo/clave coord/asistente del formulario. */
async function cttgFetchListaUsuariosStaff_() {
  const emailEl = document.getElementById('email');
  const passEl = document.getElementById('pass');
  const email = emailEl ? String(emailEl.value).trim() : '';
  const password = passEl ? String(passEl.value).trim() : '';
  if (!email || !password) {
    console.warn('[CTTG] Completa correo y contraseña de coordinadora/asistente en el formulario primero.');
    return null;
  }
  try {
    const res = await fetch(URL_APP, {
      method: 'POST',
      headers: CTTG_FETCH_HEADERS_LOGIN,
      body: JSON.stringify({ action: 'loginDebugListaUsuarios', email, password })
    });
    const raw = await res.text();
    let data;
    try {
      data = JSON.parse(raw);
    } catch (parseErr) {
      console.warn('[CTTG lista] Respuesta no JSON:', raw.slice(0, 800));
      return null;
    }
    return data;
  } catch (err) {
    console.error('[CTTG lista] Red / fetch:', err);
    return null;
  }
}

/** Solo muestra cuántos usuarios ve el servidor en la hoja (filas con email). Ej.: await cttgContarUsuariosEnConsola() */
window.cttgContarUsuariosEnConsola = async function cttgContarUsuariosEnConsola() {
  const data = await cttgFetchListaUsuariosStaff_();
  if (!data) return null;
  if (!data.success) {
    console.warn('[CTTG conteo]', data.error || data);
    return null;
  }
  console.log('[CTTG] Cantidad usuarios que el servidor encuentra en «Usuarios» (filas con email):', data.total);
  if (data.diagnostico_lectura_hoja_usuarios) {
    console.info('[CTTG] Lectura real del Sheet por Apps Script:', data.diagnostico_lectura_hoja_usuarios);
  }
  return data.total;
};

window.cttgListarUsuariosEnConsola = async function cttgListarUsuariosEnConsola() {
  const data = await cttgFetchListaUsuariosStaff_();
  if (!data) return null;
  if (!data.success) {
    console.warn('[CTTG lista]', data.error || data);
    return data;
  }
  console.log('[CTTG] Total usuarios (filas con email):', data.total);
  if (data.diagnostico_lectura_hoja_usuarios) {
    console.info('[CTTG] Lectura real del Sheet por Apps Script:', data.diagnostico_lectura_hoja_usuarios);
  }
  console.groupCollapsed('[CTTG] Tabla (total ' + data.total + ') · sin contraseñas');
  if (typeof console.table === 'function') console.table(data.usuarios);
  else console.log(data.usuarios);
  console.groupEnd();
  if (data.avisoListadoSinSecretos) console.info('[CTTG]', data.avisoListadoSinSecretos);
  return data;
};

try {
  if (typeof globalThis !== 'undefined') {
    globalThis.cttgContarUsuariosEnConsola = window.cttgContarUsuariosEnConsola;
    globalThis.cttgListarUsuariosEnConsola = window.cttgListarUsuariosEnConsola;
  }
} catch (_) {}

window.cttg = window.cttg || {};
window.cttg.contarUsuarios = window.cttgContarUsuariosEnConsola;
window.cttg.listarUsuarios = window.cttgListarUsuariosEnConsola;

console.info(
  '[CTTG coordinación] Debe estar en coordinadora_login.html (recarga fuerte Ctrl+Shift+R). Ej.: await window.cttgContarUsuariosEnConsola() o await window.cttg.contarUsuarios().'
);

/** Solo diagnóstico en navegador: no muestra contraseña. Copia el objeto y compártelo si hace falta soporte. */
function cttgLogLoginResp(kind, meta) {
  var line = '[CTTG login:' + kind + ']';
  if (typeof console.groupCollapsed === 'function') {
    console.groupCollapsed(line, meta.ms != null ? meta.ms + 'ms' : '');
    console.table ? console.table(meta) : console.log(meta);
    console.groupEnd();
  } else console.log(line, meta);
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
/** Cuando Apps Script no devuelve JSON (página HTML de Google), explica el motivo en pantalla. */
function cttgMotivoRespuestaNoJson(raw, httpStatus) {
  const txt = String(raw || '');
  if (!txt.trim()) return 'El servidor respondió vacío (HTTP ' + httpStatus + ').';
  if (/accounts\.google\.com|ServiceLogin|Iniciar sesi[oó]n|Sign in/i.test(txt)) {
    return 'Google está pidiendo iniciar sesión: en Apps Script → Implementar → Administrar implementaciones → ✏️ Editar, «Quién tiene acceso» debe ser «Cualquier usuario».';
  }
  if (/doPost/.test(txt)) {
    return 'El Apps Script no tiene la función doPost: el código no quedó guardado completo. Vuelve a pegar appscript.gs, guarda y crea una nueva versión.';
  }
  const visible = txt
    .replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/gi, ' ')
    .replace(/<[^>]+>/g, ' ')
    .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&')
    .replace(/\s+/g, ' ').trim();
  return 'Google respondió (HTTP ' + httpStatus + '): «' + visible.slice(0, 220) + (visible.length > 220 ? '…' : '') + '»';
}

async function login() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value.trim();
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');
  err.style.display = 'none';
  if (!email || !pass) { err.textContent = 'Completa todos los campos'; err.style.display = 'block'; return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Verificando...';
  try {
    const t0 = performance.now();
    const res = await fetch(URL_APP, {
      method: 'POST',
      headers: CTTG_FETCH_HEADERS_LOGIN,
      body: JSON.stringify({ action: 'login', email, password: pass })
    });
    const ms = Math.round(performance.now() - t0);
    const raw = await res.text();
    let data = null;
    try {
      data = raw ? JSON.parse(raw) : null;
    } catch (pe) {
      cttgLogLoginResp('staff-parse', {
        ms: ms,
        httpStatus: res.status,
        ok: res.ok,
        tipoContenido: res.headers.get('content-type'),
        primerosChars: raw ? raw.slice(0, 900) : '(vacío)',
        errorParse: String(pe.message || pe)
      });
      err.textContent = 'No se pudo iniciar sesión. ' + cttgMotivoRespuestaNoJson(raw, res.status);
      err.style.display = 'block';
      return;
    }
    cttgLogLoginResp('staff', {
      ms: ms,
      httpStatus: res.status,
      okHttp: res.ok,
      apiSuccess: data && data.success,
      apiError: data && data.error,
      tieneToken: !!(data && data.token),
      rol: data && data.user && data.user.rol,
      emailMatch: !!(data && data.user && String(data.user.email || '').trim())
    });

  if (data.success && data.user && data.token) {
      var rol = String(data.user.rol || '').toLowerCase();
      localStorage.setItem('cttg_admin', JSON.stringify(data.user));
      localStorage.setItem('cttg_token', data.token);
      if (rol === 'coordinadora') {
        window.location.href = 'coordinadora_dashboard.html';
      } else if (rol === 'asistente') {
        window.location.href = 'asistente_dashboard.html';
      } else if (rol === 'auxiliar') {
        window.location.href = 'asistente_dashboard.html';
      } else {
        localStorage.removeItem('cttg_admin');
        localStorage.removeItem('cttg_token');
        console.warn('[CTTG login] Cuenta con rol no permitido aquí:', rol);
        err.textContent = 'Esta cuenta no tiene perfil de coordinación, asistente o auxiliar.';
        err.style.display = 'block';
      }
    } else {
      console.warn('[CTTG login] No autorizado o error:', data && data.error);
      err.textContent = (data && data.error) ? data.error : 'Acceso restringido';
      err.style.display = 'block';
    }
  } catch(e) {
    console.error('[CTTG login] Fetch / red:', e);
    err.textContent = 'Error de conexión. Intenta de nuevo.';
    err.style.display = 'block';
  }
  finally { btn.disabled = false; btn.innerHTML = 'Ingresar al panel'; }
}
</script>
</body>
</html>
